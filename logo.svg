<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="100%" id="formatek-logo">
    <defs>
        <!-- Gradients -->
        <linearGradient id="grad-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="100%" stop-color="#4facfe" />
        </linearGradient>
        <linearGradient id="grad-purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7f00ff" />
            <stop offset="100%" stop-color="#ec4899" />
        </linearGradient>
        <linearGradient id="grad-text" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="60%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#00f2fe" />
        </linearGradient>
        <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="100%" stop-color="#7f00ff" />
        </linearGradient>

        <!-- Glow Filters -->
        <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="blur1" />
            <feGaussianBlur stdDeviation="3" result="blur2" />
            <feMerge>
                <feMergeNode in="blur1" />
                <feMergeNode in="blur2" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        
        <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <style>
        <![CDATA[
        /* Smooth scale and translate animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 2px #00f2fe); }
            50% { opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
        }

        @keyframes pulse-purple {
            0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 2px #7f00ff); }
            50% { opacity: 1; filter: drop-shadow(0 0 8px #7f00ff); }
        }

        @keyframes draw-path {
            to { stroke-dashoffset: 0; }
        }

        /* Classes for interactive elements */
        .logo-emblem {
            transform-origin: 75px 75px;
            animation: float 4s ease-in-out infinite;
        }

        .hex-bg {
            stroke: url(#grad-purple-pink);
            stroke-width: 2;
            fill: #0b0e27;
            fill-opacity: 0.65;
            transition: all 0.3s ease;
        }

        .hex-glow {
            stroke: url(#grad-cyan-blue);
            stroke-width: 1.5;
            fill: none;
            opacity: 0.4;
            animation: float 4s ease-in-out infinite;
        }

        .logo-bracket-left {
            stroke: url(#grad-cyan-blue);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: draw-path 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .logo-bracket-right {
            stroke: url(#grad-purple-pink);
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: draw-path 1.5s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
        }

        .logo-stem {
            stroke: url(#grad-cyan-blue);
            stroke-width: 6;
            stroke-linecap: round;
            fill: none;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: draw-path 1.5s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards;
        }

        .logo-bar-top {
            stroke: url(#grad-cyan-blue);
            stroke-width: 6;
            stroke-linecap: round;
            fill: none;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: draw-path 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
        }

        .logo-bar-middle {
            stroke: url(#grad-cyan-blue);
            stroke-width: 6;
            stroke-linecap: round;
            fill: none;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: draw-path 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.6s forwards;
        }

        .node-cyan {
            fill: #00f2fe;
            animation: pulse-glow 2.5s ease-in-out infinite;
        }

        .node-purple {
            fill: #ec4899;
            animation: pulse-purple 2.5s ease-in-out infinite;
        }

        .text-main {
            font-family: 'Tajawal', 'Inter', 'Segoe UI', sans-serif;
            font-weight: 800;
            font-size: 52px;
            fill: url(#grad-text);
            letter-spacing: 1px;
        }

        .text-tech {
            font-family: 'Tajawal', 'Inter', 'Segoe UI', sans-serif;
            font-weight: 800;
            font-size: 52px;
            fill: url(#grad-cyan-blue);
        }

        .text-tagline {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            font-weight: 600;
            font-size: 11px;
            fill: #a0aec0;
            letter-spacing: 7px;
            opacity: 0.8;
        }

        /* Hover effects */
        #formatek-logo:hover .hex-bg {
            stroke: url(#grad-cyan-blue);
            fill-opacity: 0.85;
            filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.4));
        }

        #formatek-logo:hover .logo-emblem {
            animation: float 2s ease-in-out infinite;
        }
        ]]>
    </style>

    <!-- Group: Emblem -->
    <g class="logo-emblem" id="logo-emblem-group">
        <!-- Glowing Hexagon Background Shadow -->
        <polygon points="75,17 125,46 125,104 75,133 25,104 25,46" class="hex-glow" filter="url(#glow-heavy)" />
        
        <!-- Outer Hexagon -->
        <polygon points="75,20 122.6,47.5 122.6,102.5 75,130 27.4,102.5 27.4,47.5" class="hex-bg" />

        <!-- Vertical F Stem -->
        <path d="M62,50 L62,100" class="logo-stem" />

        <!-- Stylized Left Bracket forming F's spine -->
        <path d="M82,45 L52,75 L82,105" class="logo-bracket-left" />

        <!-- F Bars -->
        <path d="M62,50 L95,50" class="logo-bar-top" />
        <path d="M62,75 L87,75" class="logo-bar-middle" />

        <!-- Stylized Right Bracket for balance -->
        <path d="M96,62 L111,75 L96,88" class="logo-bracket-right" />

        <!-- Glowing Nodes (Circuits) -->
        <circle cx="82" cy="45" r="4" class="node-cyan" />
        <circle cx="82" cy="105" r="4" class="node-cyan" />
        <circle cx="95" cy="50" r="4.5" class="node-cyan" />
        <circle cx="87" cy="75" r="4.5" class="node-cyan" />
        <circle cx="111" cy="75" r="3.5" class="node-purple" />
    </g>

    <!-- Group: Text (Formatek brand) -->
    <g id="logo-text-group">
        <!-- Main Title -->
        <text x="160" y="85" class="text-main">Forma<tspan class="text-tech">tek</tspan></text>
        
        <!-- Subtitle / Tagline -->
        <text x="165" y="112" class="text-tagline">LEARN • CODE • CREATE</text>

        <!-- Decorative Circuit-like line under text -->
        <path d="M165,123 L420,123" stroke="url(#grad-accent)" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
        <circle cx="420" cy="123" r="2.5" fill="#7f00ff" opacity="0.8" />
    </g>
</svg>
